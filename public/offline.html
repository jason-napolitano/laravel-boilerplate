<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta name="theme-color" content="#ffffff">

    <title>Offline</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 2rem;

            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f8fafc;
            color: #0f172a;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        h1 {
            margin-bottom: 1rem;
        }

        p {
            color: #64748b;
            line-height: 1.6;
        }

        button {
            margin-top: 1rem;
            padding: 0.75rem 1.25rem;

            border: 0;
            border-radius: 0.5rem;

            background: #0f172a;
            color: white;

            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>You’re offline</h1>

    <p>
        This page isn't available right now because
        your device isn't connected to the internet.
    </p>

    <button onclick="location.reload()">
        Try Again
    </button>
</div>

</body>
</html>
